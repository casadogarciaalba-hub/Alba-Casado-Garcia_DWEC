<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneyTrack</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header class="cabecera">
    <h1>Money<span>Track</span></h1>
  </header>


    <main>

    <!-- TABLA de movimientos con filtro (nivel 4) -->
    <section class="panel">
      <div class="panel-titulo">
        <h2>Movimientos</h2>
        <label>
          Filtrar por categoría
          <select id="filtro-categoria"></select>
        </label>
      </div>

      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Concepto</th>
              <th>Categoría</th>
              <th>Importe</th>
            </tr>
          </thead>
          <tbody id="cuerpo-tabla"></tbody>
        </table>
      </div>
    </section>

  </main>
  
  <script src="app.js"></script>
</body>
</html>
