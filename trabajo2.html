<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi primer script</title>
</head>
<body>
<p id="mensaje">Todavía no ha pasado nada.</p>
<button id="boton">Púlsame</button>

<script>
  const boton = document.getElementById('boton');
  const mensaje = document.getElementById('mensaje');
  boton.addEventListener('click', function () {
    mensaje.textContent = 'Has pulsado el botón';
  });
</script>
</body>
</html>
